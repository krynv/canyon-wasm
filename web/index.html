<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canyon Defense</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { height: 100%; margin: 0; background: #111; }
    body { display: flex; align-items: center; justify-content: center; font: 16px/1.4 system-ui, sans-serif; color: #ddd; }
    #frame { position: relative; width: min(100vw, calc(100vh * 650 / 450)); aspect-ratio: 650 / 450; background: #000; }
    #stage { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000c; }
    #overlay.ready { cursor: pointer; }
    #status { padding: 12px 20px; border: 1px solid #555; border-radius: 6px; background: #1b1b1b; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="stage" width="650" height="450"></canvas>
    <div id="overlay"><div id="status">Loading…</div></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
